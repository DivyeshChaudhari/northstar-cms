<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1F3A">
  <title>Northstar CLM — Contract Lifecycle Management</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <a class="brand" href="#" data-page="dashboard"><span class="brand-mark">N</span><span class="brand-text"><b>northstar</b><small>CONTRACT CLOUD</small></span></a>
        <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">☰</button>
      </div>

      <div class="sidebar-search">
        <div class="search-global">
          <span>⌕</span>
          <input id="globalSearch" placeholder="Search..." aria-label="Search everything">
        </div>
      </div>

      <div class="workspace-switch"><span class="workspace-icon">A</span><span class="workspace-copy"><b>Acme Corporation</b><small>Enterprise workspace</small></span><span class="chevron">⌄</span></div>

      <div class="nav-label">WORKSPACE</div>
      <nav class="main-nav" aria-label="Main navigation">
        <button class="nav-item active" data-page="dashboard"><span>▦</span><span class="nav-label-text">Overview</span></button>
        <button class="nav-item" data-page="create"><span>＋</span><span class="nav-label-text">Workflow Creation</span></button>
        <button class="nav-item" data-page="workflows"><span>↗</span><span class="nav-label-text">My Workflows</span><i class="nav-count" id="workflowCount">8</i></button>
        <button class="nav-item" data-page="repository"><span>▤</span><span class="nav-label-text">Contract Repository</span></button>
        <div class="nav-label nav-gap">LIBRARY</div>
        <button class="nav-item" data-page="templates"><span>▧</span><span class="nav-label-text">Templates</span></button>
        <button class="nav-item" data-page="clauses"><span>❝</span><span class="nav-label-text">Clause Library</span></button>
        <div class="nav-label nav-gap">ADMINISTRATION</div>
        <button class="nav-item" data-page="settings"><span>⚙</span><span class="nav-label-text">Settings</span></button>
      </nav>

      <div class="sidebar-bottom">
        <div class="help-card"><div class="help-icon">✦</div><b>Need a hand?</b><p>Explore the Northstar help center.</p><button class="text-button" data-action="help">Visit help center ↗</button></div>
        <button class="sidebar-action" data-action="notifications" aria-label="Notifications">
          <span>♧</span>
          <span class="action-text">Notifications</span>
          <i class="status-dot"></i>
        </button>
        <div class="profile"><div class="avatar avatar-purple">JD</div><div class="profile-copy"><b>Jordan Davis</b><small>Legal Operations</small></div><button class="icon-button" aria-label="Profile menu" data-action="profile">•••</button></div>
      </div>
    </aside>

    <main class="main-area">
      <section class="page-content" id="pageContent"></section>
    </main>
  </div>
  <div id="modalRoot"></div>
  <div id="toastRegion" class="toast-region" aria-live="polite"></div>
  <input type="file" id="fileInput" hidden multiple>
  <script src="script.js"></script>
</body>
</html>
